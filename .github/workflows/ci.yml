name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'notebooks/**'
      - 'results/**' 

  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'notebooks/**'
      - 'results/**'   

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/codeslavve/supportticket-complaintclassifier

jobs:

  # --------------------------------------------------
  # 1. TEST
  # --------------------------------------------------

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure DVC Google Drive
        run: |
          dvc remote modify --local gdrive gdrive_client_id "${{ secrets.DVC_GDRIVE_CLIENT_ID }}"
          dvc remote modify --local gdrive gdrive_client_secret "${{ secrets.DVC_GDRIVE_CLIENT_SECRET }}"
          dvc remote modify --local gdrive gdrive_use_service_account false

      - name: Pull DVC artifacts
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          dvc pull

      - name: Run tests
        run: |
          pytest

  # --------------------------------------------------
  # 2. LINT
  # --------------------------------------------------

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: |
          ruff check src/api

  # --------------------------------------------------
  # 3. BUILD + PUSH DOCKER IMAGE
  # --------------------------------------------------

  build:
    name: Build and Push Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    needs:
      - test
      - lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install DVC
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[gdrive]==3.67.1" "dvc-gdrive==3.0.1" "pyOpenSSL==24.2.1" "cryptography==43.0.3"

      - name: Configure DVC Google Drive
        run: |
          dvc remote modify --local gdrive gdrive_client_id "${{ secrets.DVC_GDRIVE_CLIENT_ID }}"
          dvc remote modify --local gdrive gdrive_client_secret "${{ secrets.DVC_GDRIVE_CLIENT_SECRET }}"
          dvc remote modify --local gdrive gdrive_use_service_account false

      - name: Pull DVC model artifacts
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          dvc pull

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}